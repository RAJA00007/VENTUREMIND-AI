version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: venturemind-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: venturemind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: venturemind-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: venturemind-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres123@postgres:5432/venturemind
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - ALLOW_MOCK_FALLBACK=True
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./venturemind-frontend
      dockerfile: Dockerfile
    container_name: venturemind-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
